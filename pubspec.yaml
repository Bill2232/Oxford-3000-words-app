name: oxford_3000_app
description: "Lexora — practice the Oxford 3000 word list with spelling drills, pronunciation, and progress tracking."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.4
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  flutter_tts: ^4.2.0
  freezed_annotation: ^2.4.4
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sounds/

dependency_overrides:
  # Pinned to 2.4.0 because its cached copy in PUB_CACHE has been locally
  # patched (StringListObjectInputStream inlined as a nested Java class) to
  # work around this machine's AGP failing to put the module's Kotlin compile
  # output on javac's classpath (flutter/flutter#162044). The patch lives only
  # in PUB_CACHE, not in this repo — re-apply if the pub cache is ever reset.
  shared_preferences_android: 2.4.0
